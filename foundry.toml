[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
evm_version = "cancun"   # Uniswap v4 needs transient storage
optimizer = true
optimizer_runs = 200
via_ir = true

# Deploy.s.sol writes deployments/<network>.json on a broadcast run (test/Deploy.t.sol runs it without one)
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[fuzz]
runs = 1000
